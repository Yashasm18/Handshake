name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The same suite again, on a real Postgres engine (PGlite): the production database path.
      - run: npm run test:pg
      # The test counts the site quotes must match the real suites.
      - run: node ../scripts/check-test-counts.mjs app
      - run: npm run build

  workflows:
    name: Deadline workflow (types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workflows/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node ../scripts/check-test-counts.mjs workflow
