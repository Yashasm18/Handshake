# Render Blueprint: one Node web service runs both the Next.js frontend and its API routes.
services:
  - type: web
    name: handshake
    runtime: node
    rootDir: web
    plan: starter
    # Tests guard the money rules (part pricing, refund caps, negotiation limits); a failure blocks the deploy.
    buildCommand: npm ci && npm test && npm run build
    startCommand: npm run start
    healthCheckPath: /api/config
    # Deals live on this disk so they survive redeploys and restarts.
    disk:
      name: handshake-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
